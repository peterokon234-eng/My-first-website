<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My First Website</title>

  <style>

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #f4f4f4;

      color: #222;

      text-align: center;

    }

    header {

      background: #111;

      color: white;

      padding: 30px 20px;

    }

    h1 {

      font-size: 40px;

      margin: 10px 0;

    }

    .content {

      padding: 50px 20px;

    }

    .button {

      display: inline-block;

      background: #007bff;

      color: white;

      padding: 15px 25px;

      border-radius: 8px;

      text-decoration: none;

      font-size: 18px;

      margin-top: 20px;

    }

    footer {

      margin-top: 50px;

      padding: 20px;

      background: #111;

      color: white;

    }

  </style>

</head>

<body>

  <header>

    <h1>Welcome to My Website 🚀</h1>

    <p>My first real website</p>

  </header>

  <div class="content">

    <h2>Hello, I'm Peter 👋</h2>

    <p>I'm learning how to build websites from my phone.</p>

    <a class="button" href="https://www.google.com">

      Visit Google

    </a>

  </div>

  <footer>

    © 2026 My First Website

  </footer>

</body>

</html>
